name: Build Windows 32-bit EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 32-bit CPython -> produces a 32-bit EXE that runs on
      # Windows 10 32-bit AND 64-bit.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # --only-binary=:all: makes pip fail loudly if any package has
          # no win32 wheel, instead of trying (and failing) to compile
          # from source. Way easier to debug.
          pip install --only-binary=:all: pyinstaller requests
          pip install --no-deps --only-binary=:all: pymobiledevice3
          pip install --only-binary=:all: -r requirements-win32.txt

      - name: Self-test (payload generation, no device needed)
        shell: pwsh
        run: python selftest.py

      - name: Build EXE
        shell: pwsh
        run: >
          pyinstaller --onefile --console --clean
          --name A12Bypass_Windows
          --collect-all pymobiledevice3
          app_windows.py

      - name: Package ZIP (exe + all device assets + readme)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package/assets | Out-Null
          Copy-Item dist/A12Bypass_Windows.exe dist/package/
          Copy-Item -Recurse -Force server/assets/Maker dist/package/assets/
          Copy-Item README_WINDOWS.md dist/package/
          Copy-Item GET_DRIVERS.txt dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/A12Bypass_Windows_win32.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: A12Bypass_Windows_win32
          path: dist/A12Bypass_Windows_win32.zip
          retention-days: 90

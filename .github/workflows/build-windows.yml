name: Build Windows 32-bit EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x86

      - name: Show Python and wheel tags
        shell: pwsh
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.architecture())"
          pip debug --verbose 2>&1 | Select-String -Pattern win32 | Select-Object -First 5

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: pyinstaller requests

      - name: Install pymobiledevice3 without dependency resolution
        shell: pwsh
        run: |
          pip install --no-deps --only-binary=:all: pymobiledevice3==11.43.1

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install --only-binary=:all: cryptography==48.0.1 psutil==7.1.1 pywin32==312 asn1 "bpylist2>=4.0.1" bytestruct pygments daemonize pykdebugparser pyusb rich ansilogs packaging typing_extensions pygnuutils pycrashreport fastapi uvicorn wsproto Pillow questionary ipsw_parser ifaddr hyperframe srptools developer_disk_image opack2 pytun-pmd3 prompt_toolkit python-pcapng pyimg4 pyiosbackup typer typer-injector defusedxml pmd-pytcp pmd-net-addr asgiwebdav backports.zstd IPython

      - name: Verify imports
        shell: pwsh
        run: |
          python -c "from pymobiledevice3.lockdown import create_using_usbmux; from pymobiledevice3.services.afc import AfcService; from pymobiledevice3.services.diagnostics import DiagnosticsService; from pymobiledevice3.services.syslog import SyslogService; print('ALL IMPORTS OK')"

      - name: Self-test
        shell: pwsh
        run: |
          python selftest.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --console --clean --name A12Bypass_Windows --collect-all pymobiledevice3 app_windows.py

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package/assets | Out-Null
          Copy-Item dist/A12Bypass_Windows.exe dist/package/
          Copy-Item -Recurse -Force server/assets/Maker dist/package/assets/
          Copy-Item README_WINDOWS.md dist/package/
          Copy-Item GET_DRIVERS.txt dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/A12Bypass_Windows_win32.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: A12Bypass_Windows_win32
          path: dist/A12Bypass_Windows_win32.zip
          retention-days: 90
